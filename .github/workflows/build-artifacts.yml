name: Build portable artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rte-linux-x64
          - os: windows-latest
            artifact: rte-windows-x64
          - os: macos-15-intel
            artifact: rte-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # install-qt-action selects the MSVC Qt package on Windows. Ensure CMake
      # uses the matching compiler instead of the runner's MinGW toolchain.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNODEGUI_ENABLE_FPS_OVERLAY=OFF

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      # Firmware builds only run on Linux in this matrix.  They exercise the
      # Gen6 base image, the linker map generation, and the DTCMRAM budget
      # check via analyze_memory.py.
      - name: Install ARM toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build foc-demo firmware
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          ./build/bin/RTEFirmwareBuilder
          --fw-src Images/Gen6FW
          --build-dir build/foc-demo-fw
          --graph Assets/Examples/foc_demo.json
          --base-src Images/Gen6FW
          --output build/foc-demo-fw-src
          --clean
          --build-type Release

      - name: Build induction-vhz firmware
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          ./build/bin/RTEFirmwareBuilder
          --fw-src Images/Gen6FW
          --build-dir build/induction-vhz-fw
          --graph Assets/Examples/induction_vhz.json
          --base-src Images/Gen6FW
          --output build/induction-vhz-fw-src
          --clean
          --build-type Release

      # Simulator smoke tests (Tools/tests/run_sim_smoke.sh). Linux leg only:
      # the harness is bash+python3 and the ngspice backend dlopens
      # libngspice.so, so the Windows/macOS legs cannot run these parts.
      # Each part reuses the host tools built above (build/bin/RTECodeEmitter,
      # build/bin/rte) — the script rebuilds them if missing. Locally the same
      # script runs from any cwd with no args and covers all four parts,
      # including ngspice against a locally installed libngspice.
      - name: HostSim simulator smoke
        if: runner.os == 'Linux'
        shell: bash
        run: Tools/tests/run_sim_smoke.sh --only hostsim

      # ngspice backend smoke: the dev package provides the libngspice.so
      # linker name that host_sim dlopens first (plus the libngspice0 runtime
      # as a dependency). The run also asserts a wall-time ceiling that guards
      # against the old O(n^2) resume regression.
      - name: Install ngspice
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y libngspice0-dev

      - name: HostSim ngspice-backend smoke
        if: runner.os == 'Linux'
        shell: bash
        run: Tools/tests/run_sim_smoke.sh --only ngspice

      # HostSIL: builds Images/HostSIL (real Gen6FW app on the host shims)
      # and validates the sil_foc_demo trace with scripts/validate_trace.py.
      # The `rte sim` part reuses the emitted host_sim tree from the hostsim
      # smoke step (rebuilt inside this job if it is absent).
      - name: HostSIL firmware-in-the-loop smoke
        if: runner.os == 'Linux'
        shell: bash
        run: Tools/tests/run_sim_smoke.sh --only hostsil

      - name: rte sim CLI smoke
        if: runner.os == 'Linux'
        shell: bash
        run: Tools/tests/run_sim_smoke.sh --only rte

      - name: Stage portable install
        shell: bash
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      - name: Archive
        shell: bash
        run: cmake -E tar cf "${{ matrix.artifact }}.zip" --format=zip stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
