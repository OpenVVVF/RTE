# V/Hz tuning for scenarios/induction_vhz.json (preload for the emitted
# graph's Values.Config nodes). The graph's VoltsPerHz default (1.6) would
# demand ~64 V peak at 40 Hz — far past the 2*Vdc/3 SVPWM ceiling on the 48 V
# link — so the ratio is retuned to keep the voltage vector in the linear
# modulation region, with a small boost for breakaway torque.
Induction.VoltsPerHz=0.55
Induction.BoostVolts=1.5
